<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Android MDM Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background: #060913;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      color: #f8fafc;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(99, 102, 241, 0.2);
      animation: enterCard 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes enterCard {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
    }
    .login-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 4px;
      margin: 22px 0;
      gap: 4px;
    }
    .login-tab {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 500;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .login-tab.active {
      background: #4f46e5;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.84rem;
      color: #cbd5e1;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 0.92rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.35);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: #4338ca;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .login-error {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .login-error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
    </div>
    <h1 style="text-align: center; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.3px; margin: 0;">Android MDM</h1>
    <p style="text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: 4px;">Enterprise Control Center</p>

    <div class="login-tabs">
      <button class="login-tab active" data-tab="login" id="tabLogin">Sign In</button>
      <button class="login-tab" data-tab="register" id="tabRegister">Register</button>
    </div>

    <div class="login-error" id="loginError"></div>

    <!-- Sign In Form -->
    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="loginUsername">Username or Email</label>
        <input class="form-input" type="text" id="loginUsername" name="username" placeholder="Enter username or email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input class="form-input" type="password" id="loginPassword" name="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="loginSubmitBtn">
        <span id="loginBtnText">Sign In to Dashboard</span>
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" autocomplete="on" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="regUsername">Username</label>
        <input class="form-input" type="text" id="regUsername" name="username" placeholder="Choose a username" required autocomplete="username" minlength="3">
      </div>
      <div class="form-group">
        <label class="form-label" for="regEmail">Email Address</label>
        <input class="form-input" type="email" id="regEmail" name="email" placeholder="Enter your email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <input class="form-input" type="password" id="regPassword" name="password" placeholder="Create a password" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn-submit" id="registerSubmitBtn">
        <span id="registerBtnText">Create Admin Account</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.78rem; color: #64748b;">
      <a href="/" style="color: #818cf8; text-decoration: none;">&larr; Return to Main Console</a>
    </div>
  </div>

  <script>
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginError = document.getElementById('loginError');

    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.add('show');
    }
    function hideError() {
      loginError.textContent = '';
      loginError.classList.remove('show');
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.style.display = '';
      registerForm.style.display = 'none';
      hideError();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.style.display = '';
      loginForm.style.display = 'none';
      hideError();
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const identifier = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');
      const btnText = document.getElementById('loginBtnText');
      btn.disabled = true;
      btnText.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, email: identifier })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('mdm_jwt_token', data.token);
          if (data.user) {
            localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.setItem('mdm_user', JSON.stringify(data.user));
          }
          window.location.href = '/';
        } else {
          showError(data.error || 'Invalid username/email or password.');
        }
      } catch (err) {
        showError('Network error connecting to backend: ' + err.message);
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Sign In to Dashboard';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('registerSubmitBtn');
      const btnText = document.getElementById('registerBtnText');
      btn.disabled = true;
      btnText.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('mdm_jwt_token', data.token);
          if (data.user) {
            localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.setItem('mdm_user', JSON.stringify(data.user));
          }
          window.location.href = '/';
        } else {
          showError(data.error || 'Registration failed.');
        }
      } catch (err) {
        showError('Network error: ' + err.message);
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Create Admin Account';
      }
    });
  </script>
</body>
</html>
