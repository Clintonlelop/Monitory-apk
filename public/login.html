<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Android MDM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z'/></svg>">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
      </div>
      <h1 class="login-title">Android MDM</h1>
      <p class="login-subtitle">Device Management &amp; Monitoring Control Center</p>

      <div class="login-tabs">
        <button class="login-tab active" data-tab="login" id="tabLogin">Sign In</button>
        <button class="login-tab" data-tab="register" id="tabRegister">Register</button>
      </div>

      <div class="login-error" id="loginError"></div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="loginUsername">Username or Email</label>
          <input class="form-input" type="text" id="loginUsername" name="username" placeholder="Enter username or email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input class="form-input" type="password" id="loginPassword" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-full" id="loginSubmitBtn" style="padding: 10px 16px; font-size: 14px;">
          <span id="loginBtnText">Sign In</span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" autocomplete="on" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="regUsername">Username</label>
          <input class="form-input" type="text" id="regUsername" name="username" placeholder="Choose a username" required autocomplete="username" minlength="3">
        </div>
        <div class="form-group">
          <label class="form-label" for="regEmail">Gmail / Email</label>
          <input class="form-input" type="email" id="regEmail" name="email" placeholder="Enter your email address" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <input class="form-input" type="password" id="regPassword" name="password" placeholder="Choose a password" required autocomplete="new-password" minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <input class="form-input" type="password" id="regConfirmPassword" name="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-full" id="registerSubmitBtn" style="padding: 10px 16px; font-size: 14px;">
          <span id="registerBtnText">Create Account</span>
        </button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    (function() {
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const loginError = document.getElementById('loginError');

      function showError(msg) {
        loginError.textContent = msg;
        loginError.classList.add('show');
      }
      function hideError() {
        loginError.classList.remove('show');
      }

      tabLogin.addEventListener('click', function() {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.style.display = '';
        registerForm.style.display = 'none';
        hideError();
      });

      tabRegister.addEventListener('click', function() {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.style.display = '';
        loginForm.style.display = 'none';
        hideError();
      });

      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginSubmitBtn');
        const btnText = document.getElementById('loginBtnText');
        btn.disabled = true;
        btnText.textContent = 'Signing in…';
        try {
          await Auth.login(username, password);
          window.location.href = 'index.html';
        } catch (err) {
          showError(err.message || 'Login failed. Please check your credentials.');
        } finally {
          btn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      });

      registerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirmPassword').value;
        if (password !== confirm) {
          showError('Passwords do not match.');
          return;
        }
        const btn = document.getElementById('registerSubmitBtn');
        const btnText = document.getElementById('registerBtnText');
        btn.disabled = true;
        btnText.textContent = 'Creating account…';
        try {
          await Auth.register(username, email, password);
          await Auth.login(username, password);
          window.location.href = 'index.html';
        } catch (err) {
          showError(err.message || 'Registration failed. Please try again.');
        } finally {
          btn.disabled = false;
          btnText.textContent = 'Create Account';
        }
      });
    })();
  </script>
</body>
</html>
