workflows:
  android-native-workflow:
    name: Build Android APK
    max_build_duration: 30
    environment:
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
      node: 18
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Initialize environment
        script: |
          echo "Initializing Android build environment..."
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - clintonumelo15@gmail.com
        notify:
          success: true
          failure: true
