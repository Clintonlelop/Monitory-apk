workflows:
  android-native-workflow:
    name: Build Android APK
    max_build_duration: 30
    environment:
      groups:
        - keystore_credentials
      android_signing:
        - reference_name: default_signing
          keystore: $KEYSTORE_BASE64
          keystore_password: $KEYSTORE_PASSWORD
          keystore_alias: $KEY_ALIAS
          keystore_alias_password: $KEY_ALIAS_PASSWORD
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
      node: 18
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Initialize environment and generate wrapper
        script: |
          echo "Initializing Android build environment..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - clintonumelo15@gmail.com
        notify:
          success: true
          failure: true
