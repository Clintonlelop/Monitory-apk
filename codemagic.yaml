# Codemagic CI/CD configuration for the Monitory Android app.
# Signing material is supplied through Codemagic secure environment variables —
# never embed keystores or secrets in this file.

workflows:
  android-native-workflow:
    name: Build Android APK
    max_build_duration: 30
    environment:
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
      # Secure variables (set in the Codemagic UI, marked as secure):
      #   ANDROID_KEYSTORE_BASE64  - base64-encoded debug/release keystore
      #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      node: 18
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Initialize environment
        script: |
          echo "Initializing Android build environment..."
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secure variable is not set; aborting so we never fall back to a committed keystore."
            exit 1
          fi
          echo "Recreating debug keystore from the secure environment variable..."
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > debug.keystore
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - clintonumelo15@gmail.com
        notify:
          success: true
          failure: true
